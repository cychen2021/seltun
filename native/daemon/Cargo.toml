[package]
name = "seltund"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
description = "Daemon that steers selected processes into a TUN adapter and forwards them to a local proxy."

[[bin]]
name = "seltund"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
ipstack = "1"
tun = { version = "0.8", default-features = false, features = ["async"] }
etherparse = "0.20"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_System_Console", "Win32_System_Threading", "Win32_UI_Shell"] }

[lints]
workspace = true
