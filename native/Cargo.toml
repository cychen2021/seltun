[workspace]
resolver = "3"
members = ["daemon"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
authors = ["Chuyang Chen <chuyangchen2018@outlook.com>"]
license = "MIT"
publish = false

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
toml = { version = "0.9", default-features = false, features = ["parse", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
# The Windows driver glue (IP Helper, process names) needs `unsafe`; the pure modules stay safe.
unsafe_code = "deny"

[profile.release]
lto = true
codegen-units = 1
strip = true
