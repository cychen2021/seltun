[project]
name = "seltun"
version = "0.1.0"
description = "Steer selected Windows processes into a TUN adapter and forward them to a local proxy"
readme = "README.md"
authors = [
    { name = "Chuyang Chen", email = "chuyangchen2018@outlook.com" }
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    # CLI framework. It is built on click, which uv also installs.
    "typer>=0.12.0",
    "loguru>=0.7.2",
    "rich>=14.1.0",
    "platformdirs>=4.3",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-cov>=7.1.0",
    "hatchling>=1.27",
]

[project.scripts]
seltun = "seltun:main"

[build-system]
# hatchling with a build hook (`hatch_build.py`), not uv_build. The wheel has the Rust daemon binary (`native/daemon/`) and wintun.dll in the package. Thus `uv tool install` builds and installs everything. The build needs a Rust toolchain and network access (for Wintun).
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/seltun"]

[tool.hatch.build.hooks.custom]

[tool.uv]
# Build the project (and the daemon) again when the Rust sources change, not only when the Python metadata changes.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "native/**/*.rs" },
    { file = "native/**/Cargo.toml" },
    { file = "native/Cargo.lock" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
