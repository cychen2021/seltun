[project]
name = "seltun"
version = "0.1.0"
description = "Steer selected Windows processes into a TUN adapter and forward them to Clash Verge's local port"
readme = "README.md"
authors = [
    { name = "Chuyang Chen", email = "chuyangchen2018@outlook.com" }
]
requires-python = ">=3.14"
dependencies = [
    # CLI framework (built on click, which it pulls in transitively).
    "typer>=0.12.0",
    "loguru>=0.7.2",
    "rich>=14.1.0",
    "platformdirs>=4.3",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-cov>=7.1.0",
    "hatchling>=1.27",
]

[project.scripts]
seltun = "seltun:main"

[build-system]
# hatchling with a build hook (`hatch_build.py`), not uv_build: the wheel carries the Rust daemon binary (`native/daemon/`) and wintun.dll inside the package, so `uv tool install` builds and installs everything. Building needs a Rust toolchain and network access (for Wintun).
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/seltun"]

[tool.hatch.build.hooks.custom]

[tool.uv]
# Rebuild the project (and so the daemon) when Rust sources change, not only Python metadata.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "native/**/*.rs" },
    { file = "native/**/Cargo.toml" },
    { file = "native/Cargo.lock" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
