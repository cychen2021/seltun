# Config for `seltun` and its daemon `seltund`. The command `seltun init` copies this template to the config path of the user (`%APPDATA%\seltun\config.toml` on Windows). Edit that copy. This file has no secrets. The switch state is in the data directory (`%LOCALAPPDATA%\seltun\state.json`).

[processes]
# The processes to steer. Write the file name of the executable (`哔哩哔哩.exe`) or the full path (`C:\Program Files\bilibili\哔哩哔哩.exe`). Case does not matter. When seltun is on, all traffic goes through the daemon, but the daemon does not change the traffic of the other processes. seltun steers no process until you add a name to this list.
names = []

[upstream]
# The address that receives the traffic of the selected processes. This is the mixed port of Clash Verge (SOCKS5 and HTTP).
address = "127.0.0.1:7897"
# The protocol: "socks5" or "http". The protocol "http" carries TCP only.
protocol = "socks5"
# Set this value to true to send the UDP of the selected processes through Clash. This needs `protocol = "socks5"` and a Clash proxy that supports UDP. If the value is false, DNS goes direct and the daemon drops all other UDP. The application then changes to TCP.
udp = false

[tun]
# The name and the address of the TUN adapter. The daemon creates the adapter when seltun is on. The address must not be in a network that you use. The range 198.19.0.0/16 is for tests of network devices and is not in use. The TUN mode of Clash uses 198.18.0.0/16 as its default.
name = "seltun"
address = "198.19.0.1"
mtu = 1500

[daemon]
# The loopback address that the CLI uses to control the daemon.
control = "127.0.0.1:7898"
